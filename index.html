.star{
  position:absolute;
  border-radius:9999px;
  background:white;
  animation:twinkle 3.2s ease-in-out infinite
}

@keyframes twinkle{
  0%,100%{
    opacity:.15;
    transform:scale(.7)
  }

  50%{
    opacity:1;
    transform:scale(1.25)
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-4deg)
  }

  50%{
    transform:translateY(-18px) rotate(5deg)
  }
}

@keyframes drift{
  0%{
    transform:translateX(-8vw) translateY(0) rotate(0)
  }

  50%{
    transform:translateX(4vw) translateY(-28px) rotate(8deg)
  }

  100%{
    transform:translateX(-8vw) translateY(0) rotate(0)
  }
}

@keyframes zzz{
  0%{
    opacity:0;
    transform:translate(0,8px) scale(.7)
  }

  25%{
    opacity:1
  }

  100%{
    opacity:0;
    transform:translate(18px,-28px) scale(1.35)
  }
}

@keyframes fadeBlue{
  0%{
    opacity:0
  }

  18%{
    opacity:1
  }

  78%{
    opacity:1
  }

  100%{
    opacity:0
  }
}

@keyframes crawlMove{
  0%{
    transform:rotateX(58deg) translateY(92vh)
  }

  100%{
    transform:rotateX(58deg) translateY(-145vh)
  }
}

@keyframes flashPop{
  0%{
    opacity:0
  }

  15%{
    opacity:.9
  }

  100%{
    opacity:0
  }
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(10px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.floaty{
  animation:floaty 5s ease-in-out infinite
}

.drift{
  animation:drift 11s ease-in-out infinite
}

.zzz{
  animation:zzz 2.4s ease-out infinite
}

.intro-blue{
  animation:fadeBlue 3s ease forwards
}

.crawl-wrap{
  perspective:340px;
  overflow:hidden
}

.crawl{
  transform-origin:50% 100%;
  animation:crawlMove 38s linear forwards
}

.toast{
  animation:toastIn .25s ease
}

  }

    transform:none

    transition:none
  }
